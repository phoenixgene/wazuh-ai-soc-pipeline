<!--
  Configuration blocks added to /var/ossec/etc/ossec.conf on the Wazuh
  manager. This is NOT the full config, only the additions for this
  project. Keys are placeholders.
-->

<ossec_config>
  <!-- Phase 4: check new files against VirusTotal (hash lookup only) -->
  <integration>
    <name>virustotal</name>
    <api_key>YOUR_VIRUSTOTAL_API_KEY</api_key>
    <rule_id>554</rule_id>
    <alert_format>json</alert_format>
  </integration>

  <!-- Phase 3/4: forensic quarantine command and automatic response -->
  <command>
    <name>quarantine-threat-win</name>
    <executable>quarantine-threat.exe</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <active-response>
    <disabled>no</disabled>
    <command>quarantine-threat-win</command>
    <location>local</location>
    <rules_id>87105</rules_id>
  </active-response>

  <!-- Phase 7: forward VirusTotal alerts to n8n -->
  <integration>
    <name>custom-n8n.py</name>
    <hook_url>http://127.0.0.1:5678/webhook/wazuh-alerts</hook_url>
    <rule_id>87105</rule_id>
    <alert_format>json</alert_format>
  </integration>
</ossec_config>